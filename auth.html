<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Account Sign In | Aku Store</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body>

  <header class="top-nav">
    <div class="logo" id="backToStoreBtn">
      <span class="material-symbols-outlined icon-btn">arrow_back</span>
      <span>Aku Store Account</span>
    </div>
  </header>

  <main class="detail-container" style="max-width: 480px;">
    
    <!-- Sign In / Sign Up Card -->
    <div class="upload-form" id="authCard">
      <div style="text-align: center; margin-bottom: 1rem;">
        <img src="https://upload.wikimedia.org/wikipedia/commons/d/d0/Google_Play_Arrow_logo.svg" alt="Aku Logo" style="width: 48px; height: 48px; margin-bottom: 0.5rem;">
        <h1 class="section-title" id="authTitle">Sign In</h1>
        <p style="color: var(--text-secondary); font-size: 0.9rem;">Continue to Aku Store to download apps and leave reviews.</p>
      </div>

      <!-- Auth Toggle Tabs -->
      <div style="display: flex; gap: 1rem; border-bottom: 1px solid var(--border-color); margin-bottom: 1rem;">
        <button id="tabSignIn" class="tab active" style="flex: 1; padding: 0.5rem;">Sign In</button>
        <button id="tabSignUp" class="tab" style="flex: 1; padding: 0.5rem;">Register</button>
      </div>

      <form id="authForm">
        <div class="form-group">
          <label for="authEmail">Email Address</label>
          <input type="email" id="authEmail" placeholder="user@domain.com" required>
        </div>

        <div class="form-group">
          <label for="authPassword">Password</label>
          <input type="password" id="authPassword" placeholder="••••••••" required>
        </div>

        <!-- Onboarding Fields (Shown on Register mode) -->
        <div id="registrationFields" style="display: none;">
          <div class="form-group" style="margin-top: 1rem;">
            <label for="authUsername">Username</label>
            <input type="text" id="authUsername" placeholder="e.g. akmal_dev">
          </div>

          <div class="form-group">
            <label for="authGamertag">Gamertag</label>
            <input type="text" id="authGamertag" placeholder="e.g. AkuViper99">
          </div>

          <div class="form-group">
            <label for="authAvatar">Avatar URL (Optional)</label>
            <input type="url" id="authAvatar" placeholder="https://example.com/avatar.png">
          </div>
        </div>

        <button type="submit" id="authSubmitBtn" class="install-btn" style="border: none; cursor: pointer; margin-top: 1.5rem;">
          Sign In
        </button>

        <div id="authStatusMessage" class="status-box"></div>
      </form>
    </div>

    <!-- Logged In User Profile Summary -->
    <div class="upload-form" id="profileCard" style="display: none;">
      <div style="text-align: center; margin-bottom: 1rem;">
        <img id="profileAvatarImg" src="https://via.placeholder.com/96" style="width: 96px; height: 96px; border-radius: 50%; object-fit: cover; margin-bottom: 1rem; border: 2px solid var(--accent-color);">
        <h1 class="section-title" id="profileUsername">Username</h1>
        <p style="color: var(--accent-color); font-weight: 500;" id="profileRole">Consumer</p>
        <p style="color: var(--text-secondary); font-size: 0.85rem;" id="profileEmail">email@domain.com</p>
      </div>

      <div class="stats-bar" style="margin-bottom: 1rem;">
        <div class="stat-item">
          <div class="stat-value" id="profileGamertag">-</div>
          <div class="stat-label">Gamertag</div>
        </div>
      </div>

      <button id="devApplyBtn" class="install-btn" style="background-color: var(--surface-color); border: 1px solid var(--border-color); color: var(--text-primary); margin-bottom: 0.8rem; cursor: pointer;">
        Apply for Developer Account
      </button>

      <button id="adminConsoleBtn" class="install-btn" style="background-color: #3b82f6; border: none; margin-bottom: 0.8rem; cursor: pointer; display: none;">
        Open Admin Console
      </button>

      <button id="logoutBtn" class="install-btn" style="background-color: rgba(255, 82, 82, 0.2); border: 1px solid #ff5252; color: #ff8a80; cursor: pointer;">
        Sign Out
      </button>
    </div>

  </main>

  <script src="auth.js"></script>
</body>
  </html>
