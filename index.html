<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aku Store</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body>

  <!-- Top Glass Header -->
  <header class="top-nav">
    <div class="logo" id="homeLogo">
      <img src="https://upload.wikimedia.org/wikipedia/commons/d/d0/Google_Play_Arrow_logo.svg" alt="Aku Logo" class="play-icon">
      <span>Aku Store</span>
    </div>

    <!-- Live Search Bar -->
    <div class="search-container">
      <span class="material-symbols-outlined search-icon">search</span>
      <input type="text" id="searchInput" placeholder="Search apps, games, developers...">
    </div>

    <div class="user-actions">
      <div class="profile-avatar" id="userProfileBtn">
        <span class="material-symbols-outlined" style="color: #fff;">person</span>
      </div>
    </div>
  </header>

  <!-- Navigation Tabs -->
  <nav class="category-tabs">
    <button class="tab active" data-category="all">For You</button>
    <button class="tab" data-category="apps">Apps</button>
    <button class="tab" data-category="games">Games</button>
  </nav>

  <!-- Store Main Grid Container -->
  <main class="store-content">
    <h2 class="section-title" id="gridTitle">Recommended Apps</h2>
    <div class="app-grid" id="appGrid">
      <!-- Dynamic App Cards rendered by index.js -->
    </div>
  </main>

  <script src="index.js"></script>
</body>
</html>
