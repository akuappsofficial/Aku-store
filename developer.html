<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Developer Portal | Aku Store</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body>

  <header class="top-nav">
    <div class="logo" id="backToStoreBtn">
      <span class="material-symbols-outlined icon-btn">arrow_back</span>
      <span>Aku Store Console</span>
    </div>
  </header>

  <main class="detail-container">
    <h1 class="section-title">Publish New Application</h1>
    <p style="color: var(--text-secondary); margin-bottom: 2rem;">Upload your Android package (.apk) and store listings directly to GitHub storage.</p>

    <form id="uploadForm" class="upload-form">
      
      <!-- App Identity -->
      <div class="form-group">
        <label for="appName">App Title</label>
        <input type="text" id="appName" placeholder="e.g. Aku Calculator" required>
      </div>

      <div class="form-group">
        <label for="appPackage">Package ID (Unique)</label>
        <input type="text" id="appPackage" placeholder="e.g. com.aku.calculator" pattern="^[a-z][a-z0-9_]*(\.[a-z0-9_]+)+$" required>
        <small style="color: var(--text-secondary);">Must follow standard Android format (e.g., com.developer.appname)</small>
      </div>

      <div class="form-group">
        <label for="appCategory">Category</label>
        <select id="appCategory" required>
          <option value="apps">Application</option>
          <option value="games">Game</option>
        </select>
      </div>

      <div class="form-group">
        <label for="appDesc">Description</label>
        <textarea id="appDesc" rows="4" placeholder="Describe key features of your application..." required></textarea>
      </div>

      <!-- File Inputs with Constraints -->
      <div class="form-group">
        <label for="apkFile">Android Binary File (.apk strictly)</label>
        <input type="file" id="apkFile" accept=".apk" required>
        <small id="apkFileError" class="error-msg"></small>
      </div>

      <div class="form-group">
        <label for="appIcon">App Icon (512x512 PNG/JPG)</label>
        <input type="file" id="appIcon" accept="image/png, image/jpeg" required>
        <small id="iconFileError" class="error-msg"></small>
      </div>

      <!-- GitHub Credentials for API Upload -->
      <div class="form-group" style="border-top: 1px solid var(--border-color); padding-top: 1.5rem; margin-top: 1.5rem;">
        <label for="ghToken">GitHub Personal Access Token (PAT)</label>
        <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxx" required>
        <small style="color: var(--text-secondary);">Requires <code>repo</code> access scope to write APK files to your storage repository.</small>
      </div>

      <div class="form-group">
        <label for="ghRepo">Storage Repo (username/repo-name)</label>
        <input type="text" id="ghRepo" placeholder="e.g. AkmalTheCoder93N/aku-apk-storage" required>
      </div>

      <button type="submit" id="submitBtn" class="install-btn" style="border: none; cursor: pointer; margin-top: 1rem;">
        Validate & Upload to GitHub
      </button>

      <div id="statusMessage" class="status-box"></div>
    </form>
  </main>

  <script src="developer.js"></script>
</body>
</html>
