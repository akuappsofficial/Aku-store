<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Developer Portal | Aku Store</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body>

  <header class="top-nav">
    <div class="logo" id="backBtn">
      <span class="material-symbols-outlined icon-btn">arrow_back</span>
      <span>Developer Portal</span>
    </div>
  </header>

  <main class="auth-wrapper">
    <div class="upload-form">
      <h1 class="section-title">Publish New App</h1>
      <form id="uploadAppForm">
        
        <div class="form-group">
          <label for="devAppTitle">App Title</label>
          <input type="text" id="devAppTitle" placeholder="e.g. My Custom Game" required>
        </div>

        <div class="form-group">
          <label for="devPackageId">Package Name (ID)</label>
          <input type="text" id="devPackageId" placeholder="e.g. com.developer.mygame" required>
        </div>

        <div class="form-group">
          <label for="devCategory">Category</label>
          <select id="devCategory">
            <option value="apps">Apps</option>
            <option value="games">Games</option>
          </select>
        </div>

        <div class="form-group">
          <label for="devIconUrl">App Icon URL</label>
          <input type="url" id="devIconUrl" placeholder="https://example.com/icon.png" required>
        </div>

        <div class="form-group">
          <label for="devApkUrl">APK Download Direct Link</label>
          <input type="url" id="devApkUrl" placeholder="https://example.com/app.apk" required>
        </div>

        <div class="form-group">
          <label for="devAppSize">File Size</label>
          <input type="text" id="devAppSize" placeholder="e.g. 15 MB" required>
        </div>

        <div class="form-group">
          <label for="devAppDesc">App Description</label>
          <textarea id="devAppDesc" rows="4" placeholder="Detailed app capabilities and updates..." required></textarea>
        </div>

        <button type="submit" class="install-btn">Publish App</button>
        <div id="uploadStatus" class="status-box"></div>
      </form>
    </div>
  </main>

  <script>
    document.getElementById('backBtn').addEventListener('click', () => window.location.href = 'index.html');

    document.getElementById('uploadAppForm').addEventListener('submit', (e) => {
      e.preventDefault();
      
      const session = JSON.parse(localStorage.getItem('aku_store_session') || 'null');
      if (!session || (session.role !== 'developer' && session.role !== 'admin')) {
        alert('You need a Developer or Admin account to publish apps.');
        window.location.href = 'auth.html';
        return;
      }

      const newApp = {
        id: document.getElementById('devPackageId').value.trim(),
        title: document.getElementById('devAppTitle').value.trim(),
        developer: session.username || "Developer",
        rating: 5.0,
        icon: document.getElementById('devIconUrl').value.trim(),
        category: document.getElementById('devCategory').value,
        size: document.getElementById('devAppSize').value.trim(),
        description: document.getElementById('devAppDesc').value.trim(),
        apkUrl: document.getElementById('devApkUrl').value.trim()
      };

      const existingApps = JSON.parse(localStorage.getItem('aku_uploaded_apps') || '[]');
      existingApps.push(newApp);
      localStorage.setItem('aku_uploaded_apps', JSON.stringify(existingApps));

      const statusBox = document.getElementById('uploadStatus');
      statusBox.className = "status-box success";
      statusBox.innerText = "App published successfully to store!";
      
      setTimeout(() => window.location.href = 'index.html', 1200);
    });
  </script>
</body>
</html>
