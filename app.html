<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>App Details | Aku Store</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body>

  <header class="top-nav">
    <div class="logo" id="backBtn">
      <span class="material-symbols-outlined icon-btn">arrow_back</span>
      <span>Aku Store</span>
    </div>
    <div class="user-actions">
      <div class="profile-avatar" id="userProfileBtn">
        <span class="material-symbols-outlined" style="color: #fff;">person</span>
      </div>
    </div>
  </header>

  <main class="detail-container" id="appDetailContent">
    <!-- Dynamic Header -->
    <div class="detail-header">
      <img id="detailAppIcon" src="" alt="App Icon" class="detail-app-icon">
      <div class="detail-meta">
        <h1 id="detailAppTitle" class="detail-title">Loading...</h1>
        <div id="detailAppDeveloper" class="detail-developer">Developer</div>
        <div class="verified-tag">
          <span class="material-symbols-outlined">verified</span>
          <span>Verified Publisher</span>
        </div>
      </div>
    </div>

    <!-- Quick Stats -->
    <div class="stats-bar">
      <div class="stat-item">
        <div class="stat-value"><span id="detailRating">0.0</span> <span class="material-symbols-outlined star-icon">star</span></div>
        <div class="stat-label">Rating</div>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-item">
        <div class="stat-value" id="detailSize">0 MB</div>
        <div class="stat-label">Size</div>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-item">
        <div class="stat-value" id="detailCategory">Apps</div>
        <div class="stat-label">Category</div>
      </div>
    </div>

    <!-- Download / Install Action -->
    <div class="action-section">
      <a id="downloadBtn" href="#" class="install-btn">Download APK</a>
    </div>

    <!-- Screenshots Carousel -->
    <div class="screenshots-section">
      <h2 class="section-title">Screenshots</h2>
      <div class="screenshots-scroll" id="screenshotsContainer">
        <!-- Dynamic screenshots -->
      </div>
    </div>

    <!-- About App -->
    <div style="margin-bottom: 2.5rem;">
      <h2 class="section-title">About this app</h2>
      <p id="detailDescription" class="app-description">No description provided.</p>
    </div>

    <!-- Ratings & Review Section -->
    <div style="margin-bottom: 2rem;">
      <h2 class="section-title">Ratings & Reviews</h2>
      
      <!-- Submit Review Box -->
      <div class="upload-form" style="margin-bottom: 1.5rem;">
        <h3 style="font-size: 1rem;">Write a Review</h3>
        <div class="form-group">
          <label>Rating</label>
          <select id="reviewRatingSelect">
            <option value="5">★★★★★ (5 Stars)</option>
            <option value="4">★★★★☆ (4 Stars)</option>
            <option value="3">★★★☆☆ (3 Stars)</option>
            <option value="2">★★☆☆☆ (2 Stars)</option>
            <option value="1">★☆☆☆☆ (1 Star)</option>
          </select>
        </div>
        <div class="form-group">
          <label for="reviewCommentInput">Your Experience</label>
          <textarea id="reviewCommentInput" rows="3" placeholder="Tell others what you think about this app..."></textarea>
        </div>
        <button id="submitReviewBtn" class="install-btn" style="padding: 0.7rem; font-size: 0.9rem; cursor: pointer;">Submit Review</button>
      </div>

      <!-- Published Reviews Container -->
      <div id="reviewsList" style="display: flex; flex-direction: column; gap: 1rem;">
        <!-- Dynamic Reviews -->
      </div>
    </div>
  </main>

  <script src="app-detail.js"></script>
</body>
</html>
